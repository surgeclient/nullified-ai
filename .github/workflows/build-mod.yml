# Full build of one mod sample: produces the .jar and a .zip of the Gradle project.
name: build-mod
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Path to the mod sample folder"
        default: "samples/smoke/ruby_item"
      template:
        description: "Template (Minecraft version)"
        default: "1.21.11"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: build mod
        run: python tools/build_mod.py --sample "${{ inputs.sample }}" --template "${{ inputs.template }}" --out results/build
      - uses: actions/upload-artifact@v7
        with:
          name: mod-build
          path: results/build/
