# Batch compile-check: compiles every sample in a folder against one template,
# reusing a single warm Gradle setup so each extra sample costs seconds, not minutes.
name: compile-check
on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Folder whose subfolders are mod samples"
        default: "samples/smoke"
      template:
        description: "Template (Minecraft version)"
        default: "1.21.11"

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: compile samples
        run: python tools/batch_compile.py --samples "${{ inputs.samples }}" --template "${{ inputs.template }}" --out results/compile.jsonl
      - name: summary
        if: always()
        run: |
          echo "## Compile results" >> $GITHUB_STEP_SUMMARY
          python -c "import json; rs=[json.loads(l) for l in open('results/compile.jsonl')]; print(f'**{sum(r[\"ok\"] for r in rs)}/{len(rs)} passed**\n'); [print(f'- {\"✅\" if r[\"ok\"] else \"❌\"} {r[\"sample\"]} ({r[\"stage\"]}, {r[\"seconds\"]}s)') for r in rs]" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compile-results
          path: results/
