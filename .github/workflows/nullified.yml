# Nullified AI: builds a Minecraft mod on GitHub's free servers. Nothing runs on your PC.
# The model (gpt-oss-20b, or your own trained version) runs on this server's CPU, then the mod is compiled,
# booted on a real 1.21.11 server, fixed if needed, and packaged.
#
# Start it from the Actions tab (Run workflow) or with local/nullified_remote.py.
# Needs the repo to be public (public repos get 16 GB RAM servers and unlimited minutes).
# Secrets (Settings -> Secrets and variables -> Actions) are never shown in code or logs: HF_TOKEN.
name: nullified
run-name: "${{ inputs.request }} [${{ inputs.job_id }}]"
on:
  workflow_dispatch:
    inputs:
      request:
        description: "The mod you want"
        required: true
      fix_rounds:
        description: "How many times the model may fix failed checks"
        default: "3"
      model_repo:
        description: "Hugging Face repo with the model (.gguf)"
        default: "ggml-org/gpt-oss-20b-GGUF"
      model_file:
        description: ".gguf file in that repo (empty = pick automatically)"
        default: ""
      job_id:
        description: "Leave as is (used by nullified_remote.py)"
        default: "manual"

concurrency:
  group: build-${{ inputs.job_id }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WORK: /mnt/nai
      MODEL_DIR: /mnt/nai/model
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p $WORK && sudo chown -R $USER $WORK && mkdir -p $MODEL_DIR
          df -h / /mnt || true; free -g
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .work/probe.jar
          key: probe-${{ hashFiles('tools/probe/**', 'templates/1.21.11/**') }}
      - name: install llama.cpp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p $WORK/llama && cd $WORK/llama
          # Prebuilt Linux CPU build if the latest release has one, otherwise compile it (~5 min).
          gh api repos/ggml-org/llama.cpp/releases/latest --jq '.assets[].name' > assets.txt || true
          echo "release assets:"; cat assets.txt
          name=$(grep -iE 'ubuntu' assets.txt | grep -iE 'x64|x86_64' \
                 | grep -viE 'vulkan|cuda|rocm|hip|sycl|openvino|kompute|arm|aarch64|s390' | head -1 || true)
          if [ -n "$name" ]; then
            gh release download --repo ggml-org/llama.cpp --pattern "$name" --output pkg
            (unzip -q pkg || tar xzf pkg) && rm pkg
          fi
          bin=$(find $WORK/llama -name llama-server -type f 2>/dev/null | head -1)
          if [ -z "$bin" ]; then
            echo "no prebuilt llama-server - building from source"
            git clone --depth 1 https://github.com/ggml-org/llama.cpp src
            cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF > /dev/null
            cmake --build build --target llama-server -j $(nproc) > build.log 2>&1 || (tail -50 build.log; exit 1)
            bin=$(find $WORK/llama/build -name llama-server -type f | head -1)
          fi
          chmod +x "$bin"
          dir=$(dirname "$bin")
          echo "$dir" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$dir:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          "$bin" --version || true
      - name: download model + reference docs
        env:
          MODEL_REPO: ${{ inputs.model_repo }}
          MODEL_FILE: ${{ inputs.model_file }}
        run: |
          pip install -q huggingface_hub
          path=$(python tools/fetch_model.py --repo "$MODEL_REPO" --file "$MODEL_FILE" --dir "$MODEL_DIR")
          echo "MODEL_PATH=$path" >> $GITHUB_ENV
          ls -la "$(dirname "$path")"
      - name: start the model
        run: |
          # The weights are memory-mapped, so while Gradle/Minecraft run, Linux can borrow that RAM back.
          nohup llama-server -m "$MODEL_PATH" --host 127.0.0.1 --port 8080 -c 24576 -np 1 \
            -t $(nproc) --jinja > $WORK/llama-server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health >/dev/null && echo "model ready" && exit 0; sleep 5; done
          tail -50 $WORK/llama-server.log; exit 1
      - name: build the mod
        env:
          REQUEST: ${{ inputs.request }}
          FIX_ROUNDS: ${{ inputs.fix_rounds }}
        run: |
          python local/nullified_local.py build --provider server --model nullified --context 24576 \
            --checks local --fallback-model none --fix-rounds "$FIX_ROUNDS" --request "$REQUEST"
      - name: summary
        if: always()
        run: |
          python - >> $GITHUB_STEP_SUMMARY <<'PY'
          import json, pathlib
          p = pathlib.Path("output/result.json")
          if not p.exists():
              print("No result (the build crashed - see the logs)."); raise SystemExit
          r = json.loads(p.read_text())
          print(f"## {'✅ Built' if r['ok'] else '❌ ' + ('Refused' if r['refused'] else 'Failed')}")
          print(f"**Request:** {r['request']}\n")
          if r["refused"]: print(f"**Refused:** {r['refused']}\n")
          print(f"**Checks per round:** {' → '.join(str(s) for s in r['stage_history'])}\n")
          if r["plan"]: print(f"**Plan:**\n```\n{r['plan']}\n```")
          if not r["ok"] and r["errors"]: print("**Last problems:**\n```\n" + "\n\n".join(e[:500] for e in r["errors"][:5]) + "\n```")
          jars = list(pathlib.Path("output").glob("*/*.jar"))
          if jars: print(f"\nDownload **mod** from the Artifacts section below: `{jars[0].name}`")
          PY
          tail -5 $WORK/llama-server.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mod
          path: |
            output/*/*.jar
            output/*/*.zip
            output/result.json
          retention-days: 7
